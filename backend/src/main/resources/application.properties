# ===================================================================
# AI Media Transcriber - Spring Boot Backend Configuration
# ===================================================================

# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=ai-media-backend

# MySQL Database Connection (using Environment Variables with sensible defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_media_transcriber}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Application file storage
app.storage.location=../storage

app.ffmpeg.path=ffmpeg

app.whisper.url=http://localhost:8001
